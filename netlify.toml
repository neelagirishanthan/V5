# Only the public website in site/ is deployed. Quotes and agreements stay in the repo, off the web.
[build]
  publish = "site"

# The thank-you email sent after an intake form submission (see netlify/functions).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Send visitors on the old Netlify address to the real domain. Deploy previews use other
# addresses, so they are not affected.
[[redirects]]
  from = "https://vfive.netlify.app/*"
  to = "https://v5-events.com/:splat"
  status = 301
  force = true
